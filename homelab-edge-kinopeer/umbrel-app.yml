manifestVersion: 1
id: homelab-edge-kinopeer
name: Kinopeer Edge
tagline: Kinopeer built from its main branch after every merge
# The released app's icon, from the main store; it moves to homelab-kinopeer/ once that app is there.
icon: https://raw.githubusercontent.com/MrShakhov/umbrel-homelab-edge/main/homelab-edge-kinopeer/icon.svg
category: media
# Set by the Kinopeer repository's Edge workflow: the version in its package.json and the commit.
version: "1.0.0+47d1b83"
port: 8798
description: >-
  Kinopeer as it is on its main branch, rebuilt after every merge: the changes that are not released yet, with the bugs that come with them. It runs next to the released Kinopeer and keeps its own settings, but works with the same qBittorrent and Prowlarr, so what it does to torrents is real.
developer: MrShakhov
website: https://kinopeer.com
submitter: MrShakhov
submission: https://github.com/MrShakhov/umbrel-homelab-edge
repo: https://github.com/kinopeer/kinopeer
support: https://github.com/kinopeer/kinopeer/issues
gallery: []
# Set by the Edge workflow: the commits since the previous edge build.
releaseNotes: >-
  - feat: put the poll's ring right after the Downloads title on a phone (#376)

  - chore: the owner's reason in an approval record is written in English (#373)

  - chore: the checks guard counts a blank line of context under suppressBlankEmpty (#372)

  - chore: the checks guard holds a PR until its marks have their records (#370)

  - chore: the checks guard sends a removed action or docker command to the owner (#369)

  - chore: the checks guard compares the tests that ran and what they assert (#368)
dependencies:
  - qbittorrent
  - prowlarr
path: ""
defaultUsername: ""
defaultPassword: ""
